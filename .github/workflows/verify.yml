# Foundation verification workflow (P01-T06).
# Scope: checkout, Go, TypeScript, safe caching and `make verify`.
# No deploy and no secrets. Third-party actions are pinned by commit SHA;
# the comment beside each `uses` records the tag that SHA points to, so
# upgrades are explicit and auditable.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow never writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    name: Foundation verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # The Go module currently has zero external dependencies (there is
          # no go.sum yet), so module caching would fail on the missing
          # dependency file. Enable it when go.sum appears.
          cache: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify
        run: make verify
